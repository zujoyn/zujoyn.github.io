<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>zujoyn · 课程作业主页</title>
  <meta name="description" content="zujoyn 的课程作业与个人项目汇总。">
  <style>
    :root{
      --bg:#fbfaf7; --card:#ffffff; --ink:#1f1d1a; --sub:#6b6459;
      --line:#e6e1d8; --accent:#8c2f2f; --accent-soft:#f6ece9;
    }
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{
      margin:0; background:var(--bg); color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      line-height:1.7;
    }
    .wrap{max-width:880px; margin:0 auto; padding:72px 24px 56px}
    header h1{
      margin:0 0 12px; font-size:2rem; letter-spacing:-.01em; line-height:1.3;
    }
    header .lead{margin:0; color:var(--sub); font-size:1rem; max-width:34em}
    .rule{height:1px; background:var(--line); margin:36px 0 8px; border:0}
    h2.section{
      font-size:.78rem; letter-spacing:.14em; text-transform:uppercase;
      color:var(--sub); font-weight:600; margin:0 0 16px;
    }
    .grid{display:grid; gap:16px; grid-template-columns:repeat(2,minmax(0,1fr))}
    .card{
      display:flex; flex-direction:column; gap:8px;
      background:var(--card); border:1px solid var(--line); border-radius:14px;
      padding:24px; text-decoration:none; color:inherit;
      transition:border-color .18s ease, transform .18s ease, box-shadow .18s ease;
    }
    a.card:hover{border-color:#cfc7ba; transform:translateY(-2px); box-shadow:0 8px 24px rgba(31,29,26,.06)}
    .card .tag{
      align-self:flex-start; font-size:.72rem; letter-spacing:.06em;
      color:var(--accent); background:var(--accent-soft);
      border-radius:999px; padding:3px 10px;
    }
    .card h3{margin:2px 0 0; font-size:1.05rem; line-height:1.5}
    .card p{margin:0; color:var(--sub); font-size:.9rem}
    .card .meta{margin-top:auto; padding-top:14px; font-size:.8rem; color:var(--sub); display:flex; align-items:center; gap:6px}
    .card .meta .arrow{transition:transform .18s ease}
    a.card:hover .meta .arrow{transform:translateX(3px)}
    .card--soon{opacity:.72; cursor:default}
    .card--soon .tag{color:var(--sub); background:#f1efe9}
    footer{margin-top:48px; padding-top:20px; border-top:1px solid var(--line); font-size:.82rem; color:var(--sub); display:flex; flex-wrap:wrap; gap:8px 20px}
    footer a{color:var(--sub); text-decoration:none; border-bottom:1px solid var(--line)}
    footer a:hover{color:var(--accent); border-bottom-color:var(--accent)}
    @media (max-width:640px){
      .wrap{padding:44px 20px 40px}
      header h1{font-size:1.55rem}
      .grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>zujoyn · 课程作业主页</h1>
      <p class="lead">这里汇总我的课程作业与个人项目。每次作业以独立子页面归档，按顺序排列。</p>
    </header>

    <hr class="rule">
    <h2 class="section">作业列表</h2>

    <div class="grid">
      <a class="card" href="/assignment1/">
        <span class="tag">第一次作业</span>
        <h3>大观园：曹雪芹用一座园子写尽繁华与空虚</h3>
        <p>《红楼梦》大观园主题图文长页，包含策划思路、素材整理与视频展示。</p>
        <span class="meta">查看页面 <span class="arrow">→</span></span>
      </a>

      <div class="card card--soon">
        <span class="tag">第二次作业</span>
        <h3>个人博客</h3>
        <p>基于静态站点生成的个人博客，用于记录学习过程与项目实践。</p>
        <span class="meta">建设中</span>
      </div>
    </div>

    <footer>
      <span>© 2026 zujoyn</span>
      <a href="https://github.com/zujoyn" target="_blank" rel="noopener">GitHub</a>
      <a href="/assignment1/">第一次作业</a>
    </footer>
  </div>
</body>
</html>
