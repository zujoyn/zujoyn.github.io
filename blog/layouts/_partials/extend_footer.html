{{- /* 背景特效：亮色飘花瓣，暗色星空 */}}
<canvas id="bg-fx" aria-hidden="true"></canvas>
<style>
  #bg-fx {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: -1;
  }
  @media (prefers-reduced-motion: reduce) {
    #bg-fx { display: none; }
  }
</style>
<script>
(function () {
  var canvas = document.getElementById('bg-fx');
  if (!canvas) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  if (reduce.matches) return;

  var ctx = canvas.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0;
  var petals = [], stars = [], meteors = [];
  var mode = 'light';
  var raf = null;

  function currentMode() {
    return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  }

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    seed();
  }

  function rand(a, b) { return a + Math.random() * (b - a); }

  function seed() {
    var petalCount = Math.max(10, Math.min(34, Math.round(W / 34)));
    var starCount = Math.max(40, Math.min(140, Math.round(W / 11)));
    petals = [];
    stars = [];
    meteors = [];
    for (var i = 0; i < petalCount; i++) petals.push(newPetal(true));
    for (var j = 0; j < starCount; j++) stars.push(newStar(true));
  }

  function newPetal(anywhere) {
    return {
      x: rand(-40, W + 40),
      y: anywhere ? rand(-H, H) : rand(-60, -10),
      r: rand(4.5, 9),
      vy: rand(0.45, 1.25),
      vx: rand(-0.35, 0.35),
      rot: rand(0, Math.PI * 2),
      vr: rand(-0.02, 0.02),
      sway: rand(0.6, 1.8),
      phase: rand(0, Math.PI * 2),
      alpha: rand(0.45, 0.8),
      hue: Math.random() < 0.35 ? rand(330, 348) : rand(348, 360)
    };
  }

  function newStar(anywhere) {
    return {
      x: rand(0, W),
      y: anywhere ? rand(0, H * 0.92) : rand(-20, H * 0.2),
      r: rand(0.6, 1.9),
      base: rand(0.25, 0.9),
      amp: rand(0.2, 0.55),
      spd: rand(0.008, 0.03),
      phase: rand(0, Math.PI * 2),
      drift: rand(0.02, 0.12)
    };
  }

  function spawnMeteor() {
    meteors.push({
      x: rand(W * 0.1, W * 0.9),
      y: rand(0, H * 0.35),
      vx: rand(-6.5, -3.5),
      vy: rand(2.5, 4.5),
      life: 1
    });
  }

  function drawPetal(p, t) {
    var sway = Math.sin(t * 0.0009 * p.sway + p.phase) * 0.8;
    ctx.save();
    ctx.translate(p.x + sway, p.y);
    ctx.rotate(p.rot);
    var g = ctx.createLinearGradient(-p.r, -p.r, p.r, p.r);
    g.addColorStop(0, 'hsla(' + p.hue + ',85%,88%,' + p.alpha + ')');
    g.addColorStop(1, 'hsla(' + (p.hue - 8) + ',70%,74%,' + (p.alpha * 0.75) + ')');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(0, 0, p.r, p.r * 0.55, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawStar(s, t) {
    var a = s.base + Math.sin(t * s.spd + s.phase) * s.amp;
    if (a <= 0.02) return;
    ctx.beginPath();
    ctx.fillStyle = 'rgba(255,255,255,' + Math.min(a, 1) + ')';
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
    if (s.r > 1.4) {
      ctx.beginPath();
      ctx.fillStyle = 'rgba(190,240,255,' + Math.min(a * 0.22, 0.3) + ')';
      ctx.arc(s.x, s.y, s.r * 3.2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function step(t) {
    ctx.clearRect(0, 0, W, H);
    if (mode === 'light') {
      for (var i = 0; i < petals.length; i++) {
        var p = petals[i];
        p.y += p.vy;
        p.x += p.vx + Math.sin(t * 0.0007 * p.sway + p.phase) * 0.35;
        p.rot += p.vr;
        if (p.y - 20 > H || p.x < -80 || p.x > W + 80) petals[i] = newPetal(false);
        drawPetal(p, t);
      }
    } else {
      for (var j = 0; j < stars.length; j++) {
        var s = stars[j];
        s.y += s.drift;
        if (s.y > H) { stars[j] = newStar(false); continue; }
        drawStar(s, t);
      }
      if (Math.random() < 0.0016 && meteors.length < 2) spawnMeteor();
      for (var k = meteors.length - 1; k >= 0; k--) {
        var m = meteors[k];
        m.x += m.vx;
        m.y += m.vy;
        m.life -= 0.012;
        if (m.life <= 0) { meteors.splice(k, 1); continue; }
        var tail = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * 12, m.y - m.vy * 12);
        tail.addColorStop(0, 'rgba(255,255,255,' + m.life * 0.85 + ')');
        tail.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.strokeStyle = tail;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(m.x, m.y);
        ctx.lineTo(m.x - m.vx * 12, m.y - m.vy * 12);
        ctx.stroke();
      }
    }
    raf = requestAnimationFrame(step);
  }

  function start() {
    if (raf) return;
    raf = requestAnimationFrame(step);
  }

  function stop() {
    if (raf) cancelAnimationFrame(raf);
    raf = null;
    ctx.clearRect(0, 0, W, H);
  }

  function sync() {
    var next = currentMode();
    if (next !== mode) {
      mode = next;
      seed();
    }
  }

  new MutationObserver(sync).observe(document.documentElement, {
    attributes: true,
    attributeFilter: ['data-theme', 'class']
  });

  window.addEventListener('resize', function () {
    clearTimeout(window.__bgfxT);
    window.__bgfxT = setTimeout(resize, 180);
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stop(); else start();
  });

  mode = currentMode();
  resize();
  start();
})();
</script>

{{- if .IsHome }}
{{- /* 首页开场：每篇文章化作一个泡泡，点破一个后还原成卡片列表 */}}
<div id="bubble-stage" hidden>
  <p class="bubble-hint">点破任意一个泡泡</p>
</div>
<style>
  #bubble-stage {
    position: fixed;
    inset: 0;
    z-index: 60;
    opacity: 1;
    pointer-events: none;
    transition: opacity .5s ease;
  }
  #bubble-stage[hidden] { display: none; }
  #bubble-stage.is-fading { opacity: 0; }

  .bubble {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    border: 1px solid rgba(255, 255, 255, .78);
    border-radius: 50%;
    background:
      radial-gradient(circle at 32% 28%,
        rgba(255, 255, 255, .94) 0%,
        rgba(216, 247, 237, .58) 42%,
        rgba(150, 222, 200, .34) 72%,
        rgba(120, 200, 180, .24) 100%);
    box-shadow:
      0 12px 32px rgba(18, 86, 72, .16),
      inset -8px -10px 22px rgba(255, 255, 255, .55),
      inset 7px 9px 18px rgba(120, 200, 180, .22);
    -webkit-backdrop-filter: blur(2px);
    backdrop-filter: blur(2px);
    color: var(--primary);
    font-size: 13px;
    line-height: 1.55;
    text-align: center;
    cursor: pointer;
    pointer-events: auto;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    animation: bubble-float var(--dur, 11s) ease-in-out var(--delay, 0s) infinite alternate;
    transition: filter .25s ease, box-shadow .25s ease;
  }
  .bubble:hover {
    filter: brightness(1.06) saturate(1.08);
    box-shadow:
      0 16px 40px rgba(18, 86, 72, .22),
      inset -8px -10px 22px rgba(255, 255, 255, .6),
      inset 7px 9px 18px rgba(120, 200, 180, .26);
  }
  .bubble span {
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
    letter-spacing: .02em;
  }

  :root[data-theme="dark"] .bubble {
    border-color: rgba(140, 235, 215, .34);
    background:
      radial-gradient(circle at 32% 28%,
        rgba(150, 240, 220, .30) 0%,
        rgba(48, 120, 104, .34) 55%,
        rgba(14, 44, 40, .46) 100%);
    box-shadow:
      0 12px 32px rgba(0, 0, 0, .35),
      inset -8px -10px 22px rgba(160, 245, 225, .10),
      inset 7px 9px 18px rgba(0, 0, 0, .22);
    color: #ddf6ee;
  }

  .bubble.is-pop {
    animation: bubble-pop .42s cubic-bezier(.3, .8, .4, 1) forwards;
  }
  @keyframes bubble-pop {
    0% { transform: scale(1); opacity: 1; }
    45% { transform: scale(1.16); opacity: .92; }
    100% { transform: scale(1.5); opacity: 0; }
  }

  .bubble-particle {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #fff 0%, rgba(178, 236, 216, .85) 55%, rgba(140, 214, 192, .35) 100%);
    pointer-events: none;
    transition: transform .6s cubic-bezier(.2, .7, .3, 1), opacity .6s ease;
  }

  .bubble-hint {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translateX(-50%);
    margin: 0;
    padding: 7px 16px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .62);
    border: 1px solid rgba(255, 255, 255, .8);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    color: var(--secondary);
    font-size: 12.5px;
    letter-spacing: .12em;
    animation: hint-breathe 2.6s ease-in-out infinite;
  }
  :root[data-theme="dark"] .bubble-hint {
    background: rgba(10, 34, 30, .55);
    border-color: rgba(140, 235, 215, .22);
  }
  @keyframes hint-breathe {
    0%, 100% { opacity: .65; }
    50% { opacity: 1; }
  }

  @keyframes bubble-float {
    0% { transform: translate(0, 0); }
    50% { transform: translate(var(--dx1, 10px), var(--dy1, -12px)); }
    100% { transform: translate(var(--dx2, -12px), var(--dy2, 8px)); }
  }

  body.bubbles-lock { overflow: hidden; }

  @media (max-width: 640px) {
    .bubble { font-size: 11.5px; padding: 12px; }
    .bubble-hint { bottom: 18px; font-size: 11.5px; }
  }
</style>
<script>
(function () {
  var stage = document.getElementById('bubble-stage');
  if (!stage) return;

  var entries = [].slice.call(document.querySelectorAll('.post-entry'));
  if (!entries.length) { stage.remove(); return; }

  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    stage.remove();
    return;
  }

  var items = [];
  entries.forEach(function (el) {
    var h = el.querySelector('h2') || el.querySelector('h3');
    if (!h) return;
    items.push({ el: el, title: h.textContent.trim() });
  });
  if (!items.length) { stage.remove(); return; }

  var vw = window.innerWidth;
  var vh = window.innerHeight;
  var placed = [];
  var done = false;

  items.forEach(function (it) {
    it.el.style.transition = 'opacity .55s ease, transform .55s cubic-bezier(.2, .7, .3, 1)';
    it.el.style.opacity = '0';
    it.el.style.transform = 'translateY(16px)';
  });
  document.body.classList.add('bubbles-lock');

  function rand(a, b) { return a + Math.random() * (b - a); }

  function radiusFor(title) {
    var base = 44 + title.length * 1.55;
    var max = vw < 640 ? 76 : 102;
    var min = vw < 640 ? 50 : 58;
    return Math.max(min, Math.min(max, base));
  }

  function positionFor(r) {
    var pad = 18;
    var topMin = Math.max(vh * 0.30, 120);
    var topMax = vh - r - 86;
    var leftMin = pad + r;
    var leftMax = vw - r - pad;
    var best = null;

    for (var t = 0; t < 60; t++) {
      var x = rand(leftMin, Math.max(leftMin, leftMax));
      var y = rand(topMin, Math.max(topMin, topMax));
      var ok = true;
      for (var i = 0; i < placed.length; i++) {
        var p = placed[i];
        var dx = p.x - x, dy = p.y - y;
        var need = (p.r + r) * 0.92;
        if (dx * dx + dy * dy < need * need) { ok = false; break; }
      }
      if (ok) { best = { x: x, y: y, r: r }; break; }
    }
    if (!best) {
      best = {
        x: rand(leftMin, Math.max(leftMin, leftMax)),
        y: rand(topMin, Math.max(topMin, topMax)),
        r: r
      };
    }
    placed.push(best);
    return best;
  }

  items.forEach(function (it) {
    var r = radiusFor(it.title);
    var pos = positionFor(r);
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'bubble';
    b.style.width = b.style.height = (r * 2) + 'px';
    b.style.left = (pos.x - r) + 'px';
    b.style.top = (pos.y - r) + 'px';
    b.style.setProperty('--dur', rand(9, 15).toFixed(1) + 's');
    b.style.setProperty('--delay', rand(0, 4).toFixed(1) + 's');
    b.style.setProperty('--dx1', rand(6, 18).toFixed(0) + 'px');
    b.style.setProperty('--dy1', rand(-18, -8).toFixed(0) + 'px');
    b.style.setProperty('--dx2', rand(-18, -6).toFixed(0) + 'px');
    b.style.setProperty('--dy2', rand(6, 16).toFixed(0) + 'px');

    var label = document.createElement('span');
    label.textContent = it.title;
    b.appendChild(label);
    b.setAttribute('aria-label', it.title);

    b.addEventListener('click', function () {
      if (done) return;
      done = true;
      burst(pos.x, pos.y, r);
      b.classList.add('is-pop');
      setTimeout(revealAll, 380);
    });

    stage.appendChild(b);
  });

  stage.hidden = false;

  function burst(cx, cy, r) {
    var count = 16;
    for (var i = 0; i < count; i++) {
      var dot = document.createElement('div');
      dot.className = 'bubble-particle';
      var size = rand(4, 10);
      dot.style.width = dot.style.height = size + 'px';
      dot.style.left = (cx - size / 2) + 'px';
      dot.style.top = (cy - size / 2) + 'px';
      stage.appendChild(dot);

      var angle = (Math.PI * 2 / count) * i + rand(-0.25, 0.25);
      var dist = r * rand(0.85, 1.5);
      var tx = Math.cos(angle) * dist;
      var ty = Math.sin(angle) * dist;

      (function (dot, tx, ty) {
        requestAnimationFrame(function () {
          dot.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(.35)';
          dot.style.opacity = '0';
        });
        setTimeout(function () { dot.remove(); }, 700);
      })(dot, tx, ty);
    }
  }

  function revealAll() {
    stage.classList.add('is-fading');
    document.body.classList.remove('bubbles-lock');

    items.forEach(function (it, i) {
      it.el.style.transitionDelay = (i * 75) + 'ms';
      it.el.style.opacity = '1';
      it.el.style.transform = 'none';
      setTimeout(function () {
        it.el.style.transition = '';
        it.el.style.transitionDelay = '';
        it.el.style.opacity = '';
        it.el.style.transform = '';
      }, 900 + i * 75);
    });

    setTimeout(function () { stage.remove(); }, 620);
  }

  window.addEventListener('resize', function () {
    clearTimeout(window.__bubbleT);
    window.__bubbleT = setTimeout(function () {
      if (done) return;
      vw = window.innerWidth;
      vh = window.innerHeight;
      placed = [];
      [].slice.call(stage.querySelectorAll('.bubble')).forEach(function (b, i) {
        var r = parseFloat(b.style.width) / 2;
        var pos = positionFor(r);
        b.style.left = (pos.x - r) + 'px';
        b.style.top = (pos.y - r) + 'px';
      });
    }, 200);
  });
})();
</script>
{{- end }}
