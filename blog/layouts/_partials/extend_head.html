{{- /* 笔记属性区块样式 */}}
<style>
  .note-meta {
    margin: 2rem 0 1.25rem;
    padding: .9rem 1.1rem;
    border: 1px solid var(--border);
    border-left: 3px solid var(--tertiary);
    border-radius: 8px;
    background: var(--code-bg);
    font-size: .875rem;
    line-height: 1.9;
  }
  .note-meta-title {
    font-weight: 600;
    letter-spacing: .08em;
    margin-bottom: .35rem;
  }
  .note-meta dl {
    display: grid;
    grid-template-columns: 4.5em 1fr;
    gap: 0 1rem;
    margin: 0;
  }
  .note-meta dt {
    color: var(--secondary);
    margin: 0;
  }
  .note-meta dd {
    margin: 0;
    word-break: break-word;
