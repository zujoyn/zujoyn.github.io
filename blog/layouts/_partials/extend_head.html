{{- /* 笔记属性区块样式 */}}
<style>
  .note-meta {
    margin: 2rem 0 1.25rem;
    padding: .9rem 1.1rem;
    border: 1px solid var(--border);
    border-left: 3px solid var(--tertiary);
    border-radius: 8px;
    background: var(--code-bg);
    font-size: .875rem;
    line-height: 1.9;
  }
  .note-meta-title {
    font-weight: 600;
    letter-spacing: .08em;
    margin-bottom: .35rem;
  }
  .note-meta dl {
    display: grid;
    grid-template-columns: 4.5em 1fr;
    gap: 0 1rem;
    margin: 0;
  }
  .note-meta dt {
    color: var(--secondary);
    margin: 0;
  }
  .note-meta dd {
    margin: 0;
    word-break: break-word;
  }
</style>

{{- /* 全站背景：水光潋滟插画（左下角小猫与白云、右下角草地）；文章详情页除外，沿用照片背景 */}}
{{- if not (and .IsPage (eq .Section "posts")) }}
<style>
  body,
  body.list {
    background-color: #eef9f4;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.24), rgba(247, 253, 250, 0.32)),
      url("/assignment2/images/bg-home.jpg");
    background-size: cover, cover;
    background-position: center center, center bottom;
    background-repeat: no-repeat, no-repeat;
    background-attachment: fixed, fixed;
  }

  :root[data-theme="dark"] body,
  :root[data-theme="dark"] body.list {
    background-color: #081917;
    background-image:
      linear-gradient(rgba(8, 24, 22, 0.58), rgba(6, 20, 18, 0.70)),
      url("/assignment2/images/bg-home.jpg");
  }

  @media (max-width: 768px) {
    body,
    body.list {
      background-size: cover, 100% auto;
      background-position: center top, center bottom;
      background-attachment: scroll, scroll;
    }
  }
</style>
{{- end }}
